name: Vulnerability Scan

# Builds the image and fails when it contains a fixable HIGH or CRITICAL vulnerability.
# Runs on every PR, every night, and on demand. Nightly runs catch new CVEs that
# appear after a release, before the next jfrog-cli release bundle is scanned.
on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: jfrog-ecosystem-integration-env:scan
      TRIVY_IMAGE: aquasec/trivy:0.58.2
    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: docker build . -t "$IMAGE_NAME"

      # --ignore-unfixed: only report findings that have a fixed version, so every
      # failure can be fixed by a version bump.
      - name: Scan Image (report)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivy-cache:/root/.cache" \
            -v "$PWD:/work" \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format json --output /work/trivy-report.json \
              "$IMAGE_NAME"

      - name: Summarize
        if: always()
        run: |
          [ -f trivy-report.json ] || exit 0
          {
            echo "### Fixable HIGH and CRITICAL vulnerabilities"
            echo
            echo "| Package | Installed | Fixed in | Severity | CVE |"
            echo "|---|---|---|---|---|"
            jq -r '[.Results[]? | .Vulnerabilities[]?]
                   | unique_by(.PkgName + .InstalledVersion + .VulnerabilityID)
                   | sort_by(.Severity) | .[]
                   | "| \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.Severity) | \(.VulnerabilityID) |"' \
              trivy-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on findings
        run: |
          COUNT=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' trivy-report.json)
          echo "Fixable HIGH/CRITICAL findings: $COUNT"
          [ "$COUNT" -eq 0 ]

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 14

  # Scans with JFrog CLI against Repo21 (OIDC login + `jf docker scan`),
  # so a failure here is a failure the release bundle would hit.
  # Needs repo variables JF_URL, JF_OIDC_PROVIDER and JF_OIDC_AUDIENCE.
  # Optional variable XRAY_WATCH: the watch whose policy blocks release bundle distribution.
  # Skipped when JF_URL is not set and on PRs from forks (no OIDC token there).
  xray-scan:
    if: ${{ vars.JF_URL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_NAME: jfrog-ecosystem-integration-env:scan
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Repo21 via OIDC
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JF_OIDC_AUDIENCE }}

      - name: Build Image
        run: docker build . -t "$IMAGE_NAME"

      - name: Xray scan
        env:
          XRAY_WATCH: ${{ vars.XRAY_WATCH }}
        run: |
          OPTS=(--bypass-archive-limits=true)
          if [ -n "$XRAY_WATCH" ]; then
            OPTS+=(--watches="$XRAY_WATCH" --fail=true)
          else
            OPTS+=(--fail=false)
          fi
          jf docker scan "$IMAGE_NAME" "${OPTS[@]}" --format=simple-json | tee xray-report.json

      # Without a watch there is no policy, so fail on fixable High and Critical findings.
      - name: Fail on fixable High and Critical findings
        if: ${{ vars.XRAY_WATCH == '' }}
        run: |
          COUNT=$(jq '[.vulnerabilities[]? | select((.severity == "Critical" or .severity == "High") and ((.fixedVersions // []) | length > 0))] | length' xray-report.json)
          echo "Fixable High/Critical findings: $COUNT"
          [ "$COUNT" -eq 0 ]

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-report
          path: xray-report.json
          retention-days: 14
